name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        env:
          OWNER_PAT: ${{ secrets.OWNER_PAT }}
        run: |
          # 只有配置了所有者 PAT 才自动发布，避免 Release 作者变成 github-actions[bot]
          if [ -z "$OWNER_PAT" ]; then
            echo "OWNER_PAT not configured; skip auto release."
            exit 0
          fi
          export GH_TOKEN="$OWNER_PAT"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists, skip."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            "dist/xxtT-${GITHUB_REF_NAME}.apk" \
            --title "$GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md
