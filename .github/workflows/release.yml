name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        env:
          # OWNER_PAT 必须是仓库所有者自己的 PAT，Release 作者才会显示为所有者。
          # 未配置时退回 github.token，作者显示为 github-actions[bot]，不会再用协作人的 PAT。
          GH_TOKEN: ${{ secrets.OWNER_PAT || github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists, skip."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            "dist/xxtT-${GITHUB_REF_NAME}.apk" \
            --title "$GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md
